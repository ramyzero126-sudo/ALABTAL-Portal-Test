<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b10">
<title>AL ABTAL Operations</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--orange:#ff7900;--green:#28d889;--muted:#8d9aaa}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 85% 0%,#241508,transparent 42%),var(--bg);color:#f4f7fb;font-family:system-ui,sans-serif;min-height:100vh}
main{max-width:760px;margin:auto;padding:18px 14px}
header,section{border:1px solid #263342;border-radius:16px;background:linear-gradient(145deg,#171c24,#0d1118);padding:16px}
header{display:flex;align-items:center;gap:12px;border-color:#4a2b12}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#2a1708;border:1px solid var(--orange);color:var(--orange);font-size:22px}
h1{font-size:16px;margin:0;letter-spacing:.08em}
header p,.muted{color:var(--muted);font-size:12px;line-height:1.8}
header p{margin:3px 0 0}
.pill{margin-inline-start:auto;color:var(--green);font-size:11px;border:1px solid #1b6849;padding:6px 9px;border-radius:30px}
section{margin-top:18px}
h2{font-size:17px;margin:0 0 8px}
.status{margin-top:14px;padding:12px;border-radius:12px;background:#0a2119;border:1px solid #17563d;color:#9df2c9;font-size:13px}
footer{text-align:center;color:#687586;font-size:11px;margin-top:18px}
</style>
</head>
<body><main>
<header><div class="logo">✦</div><div><h1>AL ABTAL OPERATIONS</h1><p>AL ABTAL • TALABAT • طنطا</p></div><span class="pill">REMOTE UI</span></header>
<section>
<h2>قناة تحديث الواجهة</h2>
<p class="muted">تم تجهيز صفحة الواجهة البعيدة. لن تستبدل لوحة التطبيق الحالية أو تتصل ببيانات المندوبين قبل اكتمال محمّل التحديث واختباره.</p>
<div class="status">● ملفات الواجهة جاهزة للاستضافة</div>
</section>
<footer>AL ABTAL • Remote Interface Channel</footer>
</main></body></html>
