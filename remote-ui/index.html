<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080b10">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
<title>AL ABTAL Operations</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--orange:#ff7900;--green:#2dd27d;--muted:#8995a5}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:#f4f6f9;font-family:system-ui,sans-serif}
body{padding:5px 7px 10px}
#cards{display:flex;flex-direction:column;gap:7px;width:100%;max-width:780px;margin:auto}
.card{position:relative;overflow:hidden;padding:9px 10px 8px;border:1px solid #3b3025;border-radius:13px;background:linear-gradient(145deg,#1b222c,#10151d 55%,#0b0f15);box-shadow:0 4px 12px #0008,inset 0 1px #ffffff0a}
.card:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:linear-gradient(#ffc06a,var(--orange),#793400);box-shadow:0 0 9px #ff790088}
.top{display:flex;align-items:center;gap:8px;min-width:0}
.identity{flex:1;min-width:0}
.name{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:10px;color:var(--muted);margin-top:2px}
.badge{font-size:10px;font-weight:800;padding:5px 8px;border-radius:20px;white-space:nowrap;border:1px solid}
.working{color:var(--green);border-color:#246d4d;background:#0b241a}
.break{color:#ffc15a;border-color:#76501c;background:#2b1e0b}
.offline{color:#aeb8c5;border-color:#46515e;background:#1a2028}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:8px}
.metric{min-width:0;padding:6px 4px;border-radius:8px;text-align:center;background:linear-gradient(150deg,#202a36,#121820);border:1px solid #303c49}
.metric b{display:block;font-size:12px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric small{display:block;margin-top:2px;font-size:9px;color:var(--muted)}
.order{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:7px;padding:6px 8px;border-radius:8px;background:#0b1119;border:1px solid #293543;font-size:10px}
.order strong{color:var(--orange)}
.order.none strong{color:var(--muted)}
.stage{color:#d8e0e9;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shift{display:flex;justify-content:space-between;gap:8px;margin-top:6px;color:var(--muted);font-size:9px}
.actions{display:flex;justify-content:flex-end;margin-top:7px}
button{border:1px solid #a94e08;background:linear-gradient(180deg,#492609,#21160e);color:#ffb46b;border-radius:8px;padding:6px 14px;font:700 10px system-ui;min-height:29px}
.empty{padding:22px 12px;text-align:center;border:1px dashed #394453;border-radius:12px;color:var(--muted);font-size:12px;background:#10151c}
@media(min-width:520px){.card{padding:11px 13px}.metrics{gap:7px}.metric{padding:8px 5px}}
</style>
</head>
<body>
<div id="cards"><div class="empty">في انتظار بيانات المندوبين...</div></div>
<script>
(function(){
"use strict";
const root=document.getElementById("cards");
let rendered=false;
function clean(v){if(v===null||v===undefined)return "—";const s=String(v).trim();return (!s||s==="null"||s==="undefined"||s==="غير متاح")?"—":s}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function statusClass(s){
 s=String(s||"").toLowerCase().replace(/[- ]/g,"_");
 if(["working","active","on_delivery","on_delivery_order"].includes(s))return ["شغال","working"];
 if(["break","on_break","onbreak"].includes(s))return ["بريك","break"];
 return [s==="offline"||s==="inactive"?"أوفلاين":"غير محدد","offline"];
}
function notifyHeight(){
 requestAnimationFrame(()=>{
  if(rendered&&window.AlabtalNative){
   const h=Math.max(100,Math.ceil(document.documentElement.scrollHeight));
   window.AlabtalNative.onRendered(h);
  }
 });
}
function renderRiders(json,filter,limit){
 try{
  const riders=JSON.parse(json||"[]");
  if(!Array.isArray(riders))throw new Error("Invalid rider data");
  const f=String(filter||"الكل"),max=Math.max(1,Math.min(100,Number(limit)||10));
  const filtered=riders.filter(r=>{
   const st=String(r.status||"").toLowerCase().replace(/[- ]/g,"_");
   const working=["working","active","on_delivery","on_delivery_order"].includes(st);
   const br=["break","on_break","onbreak"].includes(st);
   if(f==="شغال"&&!working)return false;
   if(f==="بريك"&&!br)return false;
   if(f==="معاه أوردر"&&!r.has_orders)return false;
   if(f==="فاضي"&&r.has_orders)return false;
   return true;
  }).slice(0,max);
  if(!filtered.length){
   root.innerHTML='<div class="empty">لا توجد نتائج مطابقة للفلاتر الحالية</div>';
  }else{
   root.innerHTML=filtered.map(r=>{
    const [label,cls]=statusClass(r.status),order=!!r.has_orders;
    return '<article class="card"><div class="top"><div class="identity"><div class="name">'+esc(clean(r.name))+'</div><div class="sub">🆔 '+esc(clean(r.employee_id))+'</div></div><span class="badge '+cls+'">'+esc(label)+'</span></div>'+
    '<div class="metrics"><div class="metric"><b>'+esc(clean(r.wallet_balance))+'</b><small>المحفظة</small></div><div class="metric"><b>'+esc(clean(r.orders_count))+'</b><small>الأوردرات</small></div><div class="metric"><b>'+esc(clean(r.worked_time))+'</b><small>وقت العمل</small></div><div class="metric"><b>'+esc(clean(r.break_time))+'</b><small>البريك</small></div></div>'+
    '<div class="order '+(order?'':'none')+'"><strong>'+(order?'● معاه أوردر':'○ مفيش أوردر')+'</strong><span class="stage">'+(order?'الحالة: '+esc(clean(r.order_stage)):'لا يوجد أوردر نشط')+'</span></div>'+
    '<div class="shift"><span>بداية الشيفت: '+esc(clean(r.shift_start))+'</span><span>نهاية الشيفت: '+esc(clean(r.shift_end))+'</span></div>'+
    '<div class="actions"><button type="button" data-index="'+Number(r.native_index)+'">تفاصيل المندوب</button></div></article>';
   }).join("");
  }
  rendered=true;
  root.querySelectorAll("button[data-index]").forEach(b=>b.addEventListener("click",()=>{
   const i=Number(b.getAttribute("data-index"));
   if(Number.isInteger(i)&&window.AlabtalNative)window.AlabtalNative.openDetails(i);
  }));
  notifyHeight();
 }catch(e){
  root.innerHTML='<div class="empty">تعذر عرض الكروت</div>';
  if(window.AlabtalNative)window.AlabtalNative.onError(String(e));
 }
}
window.AlabtalRemote={renderRiders:renderRiders};
window.addEventListener("load",()=>{
 if(window.AlabtalNative)window.AlabtalNative.onReady();
});
window.addEventListener("resize",notifyHeight);
})();
</script>
</body>
</html>
