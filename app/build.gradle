plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alabtal.portaltest'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alabtal.portaltest'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        stableDebug {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeType 'PKCS12'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableDebug
        }
    }
}

dependencies {
    implementation "com.google.android.gms:play-services-auth:22.0.0"
}
