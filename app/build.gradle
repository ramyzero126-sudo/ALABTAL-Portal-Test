plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def buildNumber = System.getenv('GITHUB_RUN_NUMBER') ?: '1'

android {
    namespace 'com.alabtal.portaltest'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.alabtal.portaltest'
        minSdk 23
        targetSdk 28
        versionCode buildNumber.toInteger()
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        stableDebug {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeType 'PKCS12'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableDebug
        }
    }
}

// توحيد إصدارات Kotlin لمنع Duplicate class.
configurations.configureEach {
    resolutionStrategy.force(
        "org.jetbrains.kotlin:kotlin-stdlib:1.8.22",
        "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22",
        "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
    )
}

dependencies {
    implementation "androidx.core:core:1.15.0"
    implementation "com.google.android.gms:play-services-auth:21.3.0"

    implementation platform("com.google.firebase:firebase-bom:35.1.0")
    implementation "com.google.firebase:firebase-auth"
    implementation "com.google.firebase:firebase-firestore"
}
